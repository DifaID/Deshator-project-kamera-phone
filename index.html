<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kamera iOS Web Pro Ultra</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .camera-app {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Top Navigation Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
            padding: 0 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .icon-btn.active {
            background: #f5c518;
            color: #000;
        }

        .pill-btn {
            width: auto;
            padding: 0 10px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
        }

        /* Record Timer Indicator */
        .rec-timer {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 59, 48, 0.9);
            color: #fff;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            display: none;
            z-index: 12;
        }

        .rec-timer.show {
            display: block;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Viewfinder Area */
        .viewfinder-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        .stabilizer-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            will-change: transform;
        }

        canvas#viewfinder {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        canvas#viewfinder.ultrawide {
            transform: scale(0.78) perspective(500px) rotateX(1deg);
            border-radius: 24px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        /* Flash Screen Anim */
        .shutter-flash {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }

        .shutter-flash.animate {
            animation: flashAnim 0.3s ease-out;
        }

        @keyframes flashAnim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Drawers (Ratio & Resolution) */
        .drawer-menu {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            display: flex;
            gap: 6px;
            padding: 6px 12px;
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .drawer-menu.show {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer-option {
            background: transparent;
            border: none;
            color: #ccc;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
        }

        .drawer-option.active {
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .live-tag {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(245, 197, 24, 0.9);
            color: #000;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            display: none;
            z-index: 9;
        }

        .live-tag.show {
            display: block;
        }

        /* Bottom Control Panel */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 25px;
            z-index: 10;
        }

        /* Zoom Switcher */
        .zoom-container {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .zoom-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .zoom-btn.active {
            color: #f5c518;
            background: rgba(255, 255, 255, 0.15);
        }

        /* iOS Mode Selector (FOTO / VIDEO) */
        .mode-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .mode-btn {
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .mode-btn.active {
            color: #f5c518;
        }

        /* Shutter Bar */
        .shutter-bar {
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 30px;
        }

        .gallery-preview {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #222;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.5);
            cursor: pointer;
            position: relative;
        }

        .gallery-preview img, .gallery-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .shutter-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: transparent;
            padding: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shutter-inner {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .shutter-btn.video-mode .shutter-inner {
            background: #ff3b30;
        }

        .shutter-btn.recording .shutter-inner {
            width: 40%;
            height: 40%;
            border-radius: 6px;
            background: #ff3b30;
        }

        .shutter-btn:active .shutter-inner {
            transform: scale(0.85);
        }

        /* Gallery Modal */
        .gallery-modal {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 100;
            display: none;
            flex-direction: column;
        }

        .gallery-modal.show {
            display: flex;
        }

        .gallery-header {
            height: 55px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            background: #111;
        }

        .gallery-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .gallery-content img, .gallery-content video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .gallery-footer {
            height: 65px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #111;
            padding: 0 20px;
        }

        .live-hint {
            position: absolute;
            top: 15px;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #f5c518;
            font-weight: 600;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="camera-app">
    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <button class="icon-btn" id="flashToggle">⚡</button>
        <button class="icon-btn" id="liveToggle">LIVE</button>
        <button class="icon-btn pill-btn" id="hdrToggle">HDR</button>
        <button class="icon-btn pill-btn" id="ratioToggle">3:4</button>
        <button class="icon-btn pill-btn" id="resToggle" style="display:none;">1080p</button>
        <button class="icon-btn active" id="stabToggle" title="Stabilizer">🌐</button>
    </div>

    <!-- Recording Timer Badge -->
    <div class="rec-timer" id="recTimer">00:00</div>

    <!-- Ratio Options Drawer -->
    <div class="drawer-menu" id="ratioDrawer">
        <button class="drawer-option" data-ratio="1:1">1:1</button>
        <button class="drawer-option active" data-ratio="3:4">3:4</button>
        <button class="drawer-option" data-ratio="4:3">4:3</button>
        <button class="drawer-option" data-ratio="9:16">9:16</button>
        <button class="drawer-option" data-ratio="16:9">16:9</button>
    </div>

    <!-- Resolution Options Drawer -->
    <div class="drawer-menu" id="resDrawer">
        <button class="drawer-option" data-res="720">720p HD</button>
        <button class="drawer-option active" data-res="1080">1080p FHD</button>
        <button class="drawer-option" data-res="2160">4K Ultra HD</button>
    </div>

    <!-- Live Photo Active Tag -->
    <div class="live-tag" id="liveTag">LIVE</div>

    <!-- Viewfinder Area -->
    <div class="viewfinder-container">
        <div class="stabilizer-wrapper" id="stabWrapper">
            <canvas id="viewfinder"></canvas>
        </div>
        <div class="shutter-flash" id="shutterFlash"></div>
    </div>

    <!-- Bottom Control Panel -->
    <div class="bottom-bar">
        <!-- Zoom Options -->
        <div class="zoom-container">
            <button class="zoom-btn" data-zoom="0.5">0.5</button>
            <button class="zoom-btn active" data-zoom="1">1x</button>
            <button class="zoom-btn" data-zoom="2">2x</button>
        </div>

        <!-- Mode Selector (FOTO / VIDEO) -->
        <div class="mode-selector">
            <button class="mode-btn active" id="modePhoto">FOTO</button>
            <button class="mode-btn" id="modeVideo">VIDEO</button>
        </div>

        <!-- Shutter Bar -->
        <div class="shutter-bar">
            <div class="gallery-preview" id="galleryPreview">
                <img id="thumbImg" src="" alt="" style="display:none;">
            </div>

            <button class="shutter-btn" id="shutterBtn">
                <div class="shutter-inner"></div>
            </button>

            <button class="icon-btn" id="switchCamera">🔄</button>
        </div>
    </div>

    <!-- Persistent Gallery Modal -->
    <div class="gallery-modal" id="galleryModal">
        <div class="gallery-header">
            <button class="icon-btn" id="closeGallery">✕</button>
            <span style="font-size: 14px; font-weight: 600;">Galeri iOS</span>
            <div style="width: 40px;"></div>
        </div>
        <div class="gallery-content" id="galleryContainer">
            <div class="live-hint" id="liveHint" style="display:none;">Tahan foto untuk memutar Live Photo</div>
            <img id="galleryImg" src="" alt="">
            <video id="galleryVideo" loop playsinline controls style="display:none;"></video>
        </div>
        <div class="gallery-footer">
            <button class="icon-btn" id="downloadBtn" title="Simpan ke HP">📥</button>
            <button class="icon-btn" id="deleteBtn" title="Hapus Photo">🗑️</button>
        </div>
    </div>
</div>

<video id="webcamVideo" autoplay playsinline style="display:none;"></video>

<script>
    const config = {
        facingMode: 'user',
        zoom: 1,
        ratio: '3:4',
        mode: 'photo', // 'photo' / 'video'
        videoRes: '1080', // '720', '1080', '2160'
        isHDR: false,
        isLive: false,
        isFlash: false,
        isStab: true,
        isRecording: false
    };

    const videoEl = document.getElementById('webcamVideo');
    const canvas = document.getElementById('viewfinder');
    const ctx = canvas.getContext('2d');
    const stabWrapper = document.getElementById('stabWrapper');

    let currentStream = null;
    let trackTorch = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let liveChunks = [];
    let liveRecorder = null;
    let recTimerInterval = null;
    let recSeconds = 0;
    let db = null;
    let currentMediaList = [];
    let activeMediaIndex = 0;

    // --- IndexedDB Storage ---
    function initDatabase() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open('iOSCameraDB_v3', 1);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('media')) {
                    db.createObjectStore('media', { keyPath: 'id', autoIncrement: true });
                }
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                loadGalleryItems();
                resolve();
            };
            request.onerror = (e) => reject(e);
        });
    }

    async function saveMediaToDB(mediaObj) {
        if (!db) return;
        const tx = db.transaction('media', 'readwrite');
        const store = tx.objectStore('media');
        store.add({ ...mediaObj, timestamp: Date.now() });
        tx.oncomplete = () => loadGalleryItems();
    }

    async function loadGalleryItems() {
        if (!db) return;
        const tx = db.transaction('media', 'readonly');
        const store = tx.objectStore('media');
        const request = store.getAll();
        request.onsuccess = () => {
            currentMediaList = request.result.reverse();
            if (currentMediaList.length > 0) {
                const latest = currentMediaList[0];
                const thumb = document.getElementById('thumbImg');
                thumb.src = latest.imageUrl || latest.thumbUrl;
                thumb.style.display = 'block';
            } else {
                document.getElementById('thumbImg').style.display = 'none';
            }
        };
    }

    async function deleteCurrentMedia() {
        if (!currentMediaList.length || !db) return;
        const currentItem = currentMediaList[activeMediaIndex];
        const tx = db.transaction('media', 'readwrite');
        const store = tx.objectStore('media');
        store.delete(currentItem.id);
        tx.oncomplete = () => {
            loadGalleryItems();
            document.getElementById('galleryModal').classList.remove('show');
        };
    }

    // --- Smart Camera Stream (Tanpa Kebocoran Mikrofon) ---
    async function startCamera(withAudio = false) {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        let resHeight = 1080;
        if (config.videoRes === '720') resHeight = 720;
        if (config.videoRes === '2160') resHeight = 2160;

        try {
            const constraints = {
                video: {
                    facingMode: config.facingMode,
                    width: { ideal: Math.round(resHeight * (16/9)) },
                    height: { ideal: resHeight }
                },
                audio: withAudio // Audio HANYA aktif saat rekam video
            };

            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoEl.srcObject = currentStream;
            await videoEl.play();

            const videoTrack = currentStream.getVideoTracks()[0];
            const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
            trackTorch = capabilities.torch ? videoTrack : null;
            updateTorchState();

            startLivePhotoBuffer();
        } catch (err) {
            console.warn("Akses kamera tanpa audio:", err);
            if (withAudio) {
                startCamera(false); // Fallback tanpa audio jika audio ditolak
            }
        }
    }

    // Live Photo Recording Buffer
    function startLivePhotoBuffer() {
        if (!currentStream) return;
        try {
            const canvasStream = canvas.captureStream(30);
            liveRecorder = new MediaRecorder(canvasStream);
            liveChunks = [];

            liveRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    liveChunks.push(e.data);
                    if (liveChunks.length > 8) liveChunks.shift();
                }
            };
            liveRecorder.start(300);
        } catch (e) {}
    }

    // --- Hardware Real-Time Video Motion Stabilizer ---
    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;

    if (window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', (e) => {
            if (!config.isStab) return;
            const gx = e.rotationRate ? e.rotationRate.beta : 0;
            const gy = e.rotationRate ? e.rotationRate.alpha : 0;
            targetX = Math.max(-15, Math.min(15, gx * 0.3));
            targetY = Math.max(-15, Math.min(15, gy * 0.3));
        });
    }

    function applyStabilizer() {
        if (config.isStab) {
            currentX += (targetX - currentX) * 0.15;
            currentY += (targetY - currentY) * 0.15;
            stabWrapper.style.transform = `translate3d(${-currentX}px, ${-currentY}px, 0) scale(1.05)`;
        } else {
            stabWrapper.style.transform = `none`;
        }
        requestAnimationFrame(applyStabilizer);
    }

    // --- Render Viewfinder Loop (Super HDR & Ultra 0.5x) ---
    function renderViewfinder() {
        if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
            const [rw, rh] = config.ratio.split(':').map(Number);
            const targetRatio = rw / rh;

            let renderWidth = videoEl.videoWidth || 1280;
            let renderHeight = renderWidth / targetRatio;

            if (renderHeight > (videoEl.videoHeight || 720)) {
                renderHeight = videoEl.videoHeight || 720;
                renderWidth = renderHeight * targetRatio;
            }

            canvas.width = renderWidth;
            canvas.height = renderHeight;

            const sx = (videoEl.videoWidth - renderWidth) / 2;
            const sy = (videoEl.videoHeight - renderHeight) / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            // Efek Super HDR Ultra Filters
            if (config.isHDR) {
                ctx.filter = 'contrast(112%) saturate(120%) brightness(103%)';
            } else {
                ctx.filter = 'none';
            }

            // Unflip Kamera Depan Selfie
            if (config.facingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            const zoomFactor = (config.zoom === 0.5) ? 1 : config.zoom;
            const zw = renderWidth / zoomFactor;
            const zh = renderHeight / zoomFactor;
            const zx = sx + (renderWidth - zw) / 2;
            const zy = sy + (renderHeight - zh) / 2;

            ctx.drawImage(videoEl, zx, zy, zw, zh, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }
        requestAnimationFrame(renderViewfinder);
    }

    // Torch Control
    async function updateTorchState() {
        if (trackTorch) {
            try {
                await trackTorch.applyConstraints({
                    advanced: [{ torch: config.isFlash && config.facingMode === 'environment' }]
                });
            } catch (e) {}
        }
    }

    // --- Mode Switcher (FOTO / VIDEO) ---
    const modePhotoBtn = document.getElementById('modePhoto');
    const modeVideoBtn = document.getElementById('modeVideo');
    const shutterBtn = document.getElementById('shutterBtn');
    const ratioToggleBtn = document.getElementById('ratioToggle');
    const resToggleBtn = document.getElementById('resToggle');

    modePhotoBtn.addEventListener('click', () => {
        config.mode = 'photo';
        modePhotoBtn.classList.add('active');
        modeVideoBtn.classList.remove('active');
        shutterBtn.classList.remove('video-mode');
        ratioToggleBtn.style.display = 'flex';
        resToggleBtn.style.display = 'none';
        startCamera(false); // Matikan Mic
    });

    modeVideoBtn.addEventListener('click', () => {
        config.mode = 'video';
        modeVideoBtn.classList.add('active');
        modePhotoBtn.classList.remove('active');
        shutterBtn.classList.add('video-mode');
        ratioToggleBtn.style.display = 'none';
        resToggleBtn.style.display = 'flex';
    });

    // --- Shutter Button Action ---
    shutterBtn.addEventListener('click', async () => {
        if (config.mode === 'photo') {
            if (config.isFlash) {
                const flash = document.getElementById('shutterFlash');
                flash.classList.add('animate');
                setTimeout(() => flash.classList.remove('animate'), 300);
            }

            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            let videoBlobUrl = null;

            if (config.isLive && liveChunks.length > 0) {
                const liveBlob = new Blob(liveChunks, { type: 'video/mp4' });
                videoBlobUrl = URL.createObjectURL(liveBlob);
            }

            await saveMediaToDB({
                type: 'image',
                imageUrl: dataUrl,
                videoUrl: videoBlobUrl,
                isLive: config.isLive && !!videoBlobUrl
            });

        } else if (config.mode === 'video') {
            if (!config.isRecording) {
                await startCamera(true); // Aktifkan Mic saat merekam
                setTimeout(() => startVideoRecording(), 300);
            } else {
                stopVideoRecording();
            }
        }
    });

    function startVideoRecording() {
        config.isRecording = true;
        shutterBtn.classList.add('recording');
        recordedChunks = [];

        const stream = canvas.captureStream(30);
        if (currentStream && currentStream.getAudioTracks().length > 0) {
            stream.addTrack(currentStream.getAudioTracks()[0]);
        }

        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
            const blob = new Blob(recordedChunks, { type: 'video/mp4' });
            const videoUrl = URL.createObjectURL(blob);
            const thumbUrl = canvas.toDataURL('image/jpeg', 0.8);

            await saveMediaToDB({
                type: 'video',
                videoUrl: videoUrl,
                imageUrl: thumbUrl,
                thumbUrl: thumbUrl
            });

            startCamera(false); // Matikan Mic kembali setelah selesai merekam
        };

        mediaRecorder.start();

        recSeconds = 0;
        const timerEl = document.getElementById('recTimer');
        timerEl.classList.add('show');
        timerEl.innerText = "00:00";

        recTimerInterval = setInterval(() => {
            recSeconds++;
            const m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
            const s = String(recSeconds % 60).padStart(2, '0');
            timerEl.innerText = `${m}:${s}`;
        }, 1000);
    }

    function stopVideoRecording() {
        config.isRecording = false;
        shutterBtn.classList.remove('recording');
        if (mediaRecorder) mediaRecorder.stop();

        clearInterval(recTimerInterval);
        document.getElementById('recTimer').classList.remove('show');
    }

    // --- UI Controls & Drawers ---
    const ratioDrawer = document.getElementById('ratioDrawer');
    const resDrawer = document.getElementById('resDrawer');

    ratioToggleBtn.addEventListener('click', () => {
        resDrawer.classList.remove('show');
        ratioDrawer.classList.toggle('show');
    });

    resToggleBtn.addEventListener('click', () => {
        ratioDrawer.classList.remove('show');
        resDrawer.classList.toggle('show');
    });

    document.querySelectorAll('#ratioDrawer .drawer-option').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('#ratioDrawer .drawer-option').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            config.ratio = e.target.getAttribute('data-ratio');
            ratioToggleBtn.innerText = config.ratio;
            ratioDrawer.classList.remove('show');
        });
    });

    document.querySelectorAll('#resDrawer .drawer-option').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('#resDrawer .drawer-option').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            config.videoRes = e.target.getAttribute('data-res');
            resToggleBtn.innerText = config.videoRes === '2160' ? '4K' : config.videoRes + 'p';
            resDrawer.classList.remove('show');
            startCamera(config.isRecording);
        });
    });

    // Super HDR Toggle
    const hdrToggleBtn = document.getElementById('hdrToggle');
    hdrToggleBtn.addEventListener('click', () => {
        config.isHDR = !config.isHDR;
        hdrToggleBtn.classList.toggle('active', config.isHDR);
    });

    // 0.5x Ultrawide GPU Switch
    document.querySelectorAll('.zoom-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            config.zoom = parseFloat(e.target.getAttribute('data-zoom'));

            if (config.zoom === 0.5) {
                canvas.classList.add('ultrawide');
            } else {
                canvas.classList.remove('ultrawide');
            }
        });
    });

    // Switch Camera
    document.getElementById('switchCamera').addEventListener('click', () => {
        config.facingMode = (config.facingMode === 'user') ? 'environment' : 'user';
        startCamera(false);
    });

    // Live Photo Toggle
    const liveToggleBtn = document.getElementById('liveToggle');
    const liveTag = document.getElementById('liveTag');
    liveToggleBtn.addEventListener('click', () => {
        config.isLive = !config.isLive;
        liveToggleBtn.classList.toggle('active', config.isLive);
        liveTag.classList.toggle('show', config.isLive);
    });

    // Flash Toggle
    const flashToggleBtn = document.getElementById('flashToggle');
    flashToggleBtn.addEventListener('click', () => {
        config.isFlash = !config.isFlash;
        flashToggleBtn.classList.toggle('active', config.isFlash);
        updateTorchState();
    });

    // Stabilizer Toggle
    const stabToggleBtn = document.getElementById('stabToggle');
    stabToggleBtn.addEventListener('click', () => {
        config.isStab = !config.isStab;
        stabToggleBtn.classList.toggle('active', config.isStab);
    });

    // --- Gallery Modal Interactive Controls ---
    const galleryContainer = document.getElementById('galleryContainer');
    const galleryImg = document.getElementById('galleryImg');
    const galleryVideo = document.getElementById('galleryVideo');
    const liveHint = document.getElementById('liveHint');

    document.getElementById('galleryPreview').addEventListener('click', () => {
        if (!currentMediaList.length) return;
        activeMediaIndex = 0;
        showMediaInGallery(currentMediaList[activeMediaIndex]);
        document.getElementById('galleryModal').classList.add('show');
    });

    function showMediaInGallery(item) {
        if (item.type === 'video') {
            galleryImg.style.display = 'none';
            galleryVideo.style.display = 'block';
            galleryVideo.src = item.videoUrl;
            liveHint.style.display = 'none';
        } else {
            galleryImg.src = item.imageUrl;
            galleryImg.style.display = 'block';
            galleryVideo.style.display = 'none';

            if (item.isLive && item.videoUrl) {
                galleryVideo.src = item.videoUrl;
                liveHint.style.display = 'block';
            } else {
                liveHint.style.display = 'none';
            }
        }
    }

    // Press and Hold to Play Live Photo
    function startLivePlayback() {
        const current = currentMediaList[activeMediaIndex];
        if (current && current.isLive && current.videoUrl) {
            galleryImg.style.display = 'none';
            galleryVideo.style.display = 'block';
            galleryVideo.play();
        }
    }

    function stopLivePlayback() {
        const current = currentMediaList[activeMediaIndex];
        if (current && current.type !== 'video') {
            galleryVideo.pause();
            galleryVideo.style.display = 'none';
            galleryImg.style.display = 'block';
        }
    }

    galleryContainer.addEventListener('touchstart', startLivePlayback);
    galleryContainer.addEventListener('touchend', stopLivePlayback);
    galleryContainer.addEventListener('mousedown', startLivePlayback);
    galleryContainer.addEventListener('mouseup', stopLivePlayback);

    // Save/Download Media to Local Memory
    document.getElementById('downloadBtn').addEventListener('click', () => {
        if (!currentMediaList.length) return;
        const current = currentMediaList[activeMediaIndex];
        const a = document.createElement('a');

        if (current.type === 'video') {
            a.href = current.videoUrl;
            a.download = `video_${Date.now()}.mp4`;
        } else {
            a.href = current.imageUrl;
            a.download = `photo_${Date.now()}.jpg`;
        }

        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });

    // Delete Item
    document.getElementById('deleteBtn').addEventListener('click', () => {
        deleteCurrentMedia();
    });

    document.getElementById('closeGallery').addEventListener('click', () => {
        document.getElementById('galleryModal').classList.remove('show');
    });

    // Initialize Application
    initDatabase();
    startCamera(false);
    requestAnimationFrame(renderViewfinder);
    requestAnimationFrame(applyStabilizer);
</script>
</body>
</html>
