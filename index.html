<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kamera iOS Web Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .camera-app {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Top Navigation Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
            padding: 0 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .icon-btn.active {
            background: #f5c518;
            color: #000;
        }

        .ratio-btn {
            width: auto;
            padding: 0 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }

        /* Viewfinder Area */
        .viewfinder-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        /* Stabilizer Wrapper */
        .stabilizer-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.05s ease-out;
            will-change: transform;
        }

        /* Fast Lens Transform for Ultrawide 0.5x */
        canvas#viewfinder {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        canvas#viewfinder.ultrawide {
            transform: scale(0.78) perspective(500px) rotateX(1deg);
            border-radius: 24px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        /* Flash Animation Screen */
        .shutter-flash {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }

        .shutter-flash.animate {
            animation: flashAnim 0.3s ease-out;
        }

        @keyframes flashAnim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Ratio Drawer Options */
        .ratio-drawer {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            display: flex;
            gap: 8px;
            padding: 6px 12px;
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .ratio-drawer.show {
            opacity: 1;
            pointer-events: auto;
        }

        .ratio-option {
            background: transparent;
            border: none;
            color: #ccc;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
        }

        .ratio-option.active {
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .live-tag {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(245, 197, 24, 0.9);
            color: #000;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            display: none;
            z-index: 9;
        }

        .live-tag.show {
            display: block;
        }

        /* Bottom Control Panel */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 25px;
            z-index: 10;
        }

        /* Zoom Switcher */
        .zoom-container {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .zoom-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .zoom-btn.active {
            color: #f5c518;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Shutter Bar */
        .shutter-bar {
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 30px;
        }

        .gallery-preview {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #222;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.5);
            cursor: pointer;
            position: relative;
        }

        .gallery-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .shutter-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: transparent;
            padding: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shutter-inner {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.1s ease;
        }

        .shutter-btn:active .shutter-inner {
            transform: scale(0.85);
        }

        /* Gallery Modal Overlay */
        .gallery-modal {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 100;
            display: none;
            flex-direction: column;
        }

        .gallery-modal.show {
            display: flex;
        }

        .gallery-header {
            height: 55px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            background: #111;
        }

        .gallery-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .gallery-content img, .gallery-content video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .gallery-footer {
            height: 65px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #111;
            padding: 0 20px;
        }

        .live-hint {
            position: absolute;
            top: 15px;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #f5c518;
            font-weight: 600;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="camera-app">
    <!-- Top Bar Navigation -->
    <div class="top-bar">
        <button class="icon-btn" id="flashToggle">⚡</button>
        <button class="icon-btn" id="liveToggle">LIVE</button>
        <button class="icon-btn ratio-btn" id="ratioToggle">3:4</button>
        <button class="icon-btn" id="stabToggle" title="Stabilizer">🌐</button>
    </div>

    <!-- Ratio Options Drawer -->
    <div class="ratio-drawer" id="ratioDrawer">
        <button class="ratio-option" data-ratio="1:1">1:1</button>
        <button class="ratio-option active" data-ratio="3:4">3:4</button>
        <button class="ratio-option" data-ratio="4:3">4:3</button>
        <button class="ratio-option" data-ratio="2:3">2:3</button>
        <button class="ratio-option" data-ratio="3:2">3:2</button>
        <button class="ratio-option" data-ratio="9:16">9:16</button>
        <button class="ratio-option" data-ratio="16:9">16:9</button>
    </div>

    <!-- Live Photo Active Tag -->
    <div class="live-tag" id="liveTag">LIVE</div>

    <!-- Viewfinder Area -->
    <div class="viewfinder-container">
        <div class="stabilizer-wrapper" id="stabWrapper">
            <canvas id="viewfinder"></canvas>
        </div>
        <div class="shutter-flash" id="shutterFlash"></div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-bar">
        <!-- Zoom Options -->
        <div class="zoom-container">
            <button class="zoom-btn" data-zoom="0.5">0.5</button>
            <button class="zoom-btn active" data-zoom="1">1x</button>
            <button class="zoom-btn" data-zoom="2">2x</button>
        </div>

        <!-- Shutter Buttons -->
        <div class="shutter-bar">
            <div class="gallery-preview" id="galleryPreview">
                <img id="thumbImg" src="" alt="" style="display:none;">
            </div>

            <button class="shutter-btn" id="shutterBtn">
                <div class="shutter-inner"></div>
            </button>

            <button class="icon-btn" id="switchCamera">🔄</button>
        </div>
    </div>

    <!-- Persistent Gallery Modal -->
    <div class="gallery-modal" id="galleryModal">
        <div class="gallery-header">
            <button class="icon-btn" id="closeGallery">✕</button>
            <span style="font-size: 14px; font-weight: 600;">Galeri iOS</span>
            <div style="width: 40px;"></div>
        </div>
        <div class="gallery-content" id="galleryContainer">
            <div class="live-hint" id="liveHint" style="display:none;">Tahan foto untuk memutar Live Photo</div>
            <img id="galleryImg" src="" alt="">
            <video id="galleryVideo" loop playsinline style="display:none;"></video>
        </div>
        <div class="gallery-footer">
            <button class="icon-btn" id="downloadBtn" title="Simpan ke HP">📥</button>
            <button class="icon-btn" id="deleteBtn" title="Hapus Photo">🗑️</button>
        </div>
    </div>
</div>

<video id="webcamVideo" autoplay playsinline style="display:none;"></video>

<script>
    const config = {
        facingMode: 'user',
        zoom: 1,
        ratio: '3:4',
        isLive: false,
        isFlash: false,
        isStab: true
    };

    const videoEl = document.getElementById('webcamVideo');
    const canvas = document.getElementById('viewfinder');
    const ctx = canvas.getContext('2d');
    const stabWrapper = document.getElementById('stabWrapper');

    let currentStream = null;
    let trackTorch = null;
    let mediaRecorder = null;
    let liveChunks = [];
    let db = null;
    let currentMediaList = [];
    let activeMediaIndex = 0;

    // --- IndexedDB: Permanently Save Media to Local Device ---
    function initDatabase() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open('iOSCameraDB', 1);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('media')) {
                    db.createObjectStore('media', { keyPath: 'id', autoIncrement: true });
                }
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                loadGalleryItems();
                resolve();
            };
            request.onerror = (e) => reject(e);
        });
    }

    async function saveMediaToDB(mediaObj) {
        if (!db) return;
        const tx = db.transaction('media', 'readwrite');
        const store = tx.objectStore('media');
        store.add({ ...mediaObj, timestamp: Date.now() });
        tx.oncomplete = () => loadGalleryItems();
    }

    async function loadGalleryItems() {
        if (!db) return;
        const tx = db.transaction('media', 'readonly');
        const store = tx.objectStore('media');
        const request = store.getAll();
        request.onsuccess = () => {
            currentMediaList = request.result.reverse();
            if (currentMediaList.length > 0) {
                const latest = currentMediaList[0];
                const thumb = document.getElementById('thumbImg');
                thumb.src = latest.imageUrl;
                thumb.style.display = 'block';
            } else {
                document.getElementById('thumbImg').style.display = 'none';
            }
        };
    }

    async function deleteCurrentMedia() {
        if (!currentMediaList.length || !db) return;
        const currentItem = currentMediaList[activeMediaIndex];
        const tx = db.transaction('media', 'readwrite');
        const store = tx.objectStore('media');
        store.delete(currentItem.id);
        tx.oncomplete = () => {
            loadGalleryItems();
            document.getElementById('galleryModal').classList.remove('show');
        };
    }

    // --- Start Camera & Stream Processing ---
    async function startCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        try {
            const constraints = {
                video: {
                    facingMode: config.facingMode,
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoEl.srcObject = currentStream;
            await videoEl.play();

            // Hardware Flash Torch Check
            const videoTrack = currentStream.getVideoTracks()[0];
            const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
            trackTorch = capabilities.torch ? videoTrack : null;
            updateTorchState();

            startLivePhotoBuffer();
        } catch (err) {
            console.warn("Camera stream error:", err);
        }
    }

    // Continuous Recording Buffer for Live Photo
    function startLivePhotoBuffer() {
        if (!currentStream) return;
        try {
            const canvasStream = canvas.captureStream(30);
            mediaRecorder = new MediaRecorder(canvasStream);
            liveChunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    liveChunks.push(e.data);
                    if (liveChunks.length > 10) liveChunks.shift(); // Keep last ~3 seconds
                }
            };
            mediaRecorder.start(300);
        } catch (e) {
            console.log("Recorder initialization bypassed");
        }
    }

    // --- Gyroscope Real-Time Video Motion Stabilizer ---
    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;

    if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
            if (!config.isStab) return;
            targetX = (e.gamma || 0) * 0.25; // Roll compensation
            targetY = (e.beta || 0) * 0.25;  // Pitch compensation
        });
    }

    function applyStabilizer() {
        if (config.isStab) {
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;
            stabWrapper.style.transform = `translate3d(${-currentX}px, ${-currentY}px, 0) scale(1.05)`;
        } else {
            stabWrapper.style.transform = `none`;
        }
        requestAnimationFrame(applyStabilizer);
    }

    // --- High Performance Hardware Acceleration Render Loop ---
    function renderViewfinder() {
        if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
            const [rw, rh] = config.ratio.split(':').map(Number);
            const targetRatio = rw / rh;

            let renderWidth = videoEl.videoWidth || 640;
            let renderHeight = renderWidth / targetRatio;

            if (renderHeight > (videoEl.videoHeight || 480)) {
                renderHeight = videoEl.videoHeight || 480;
                renderWidth = renderHeight * targetRatio;
            }

            canvas.width = renderWidth;
            canvas.height = renderHeight;

            const sx = (videoEl.videoWidth - renderWidth) / 2;
            const sy = (videoEl.videoHeight - renderHeight) / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            // Selfie Camera Correct Orientation
            if (config.facingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            // Zoom 1x & 2x
            const zoomFactor = (config.zoom === 0.5) ? 1 : config.zoom;
            const zw = renderWidth / zoomFactor;
            const zh = renderHeight / zoomFactor;
            const zx = sx + (renderWidth - zw) / 2;
            const zy = sy + (renderHeight - zh) / 2;

            ctx.drawImage(videoEl, zx, zy, zw, zh, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }
        requestAnimationFrame(renderViewfinder);
    }

    // --- Flash Control ---
    async function updateTorchState() {
        if (trackTorch) {
            try {
                await trackTorch.applyConstraints({
                    advanced: [{ torch: config.isFlash && config.facingMode === 'environment' }]
                });
            } catch (e) {}
        }
    }

    // --- Capture Photo & Live Photo ---
    document.getElementById('shutterBtn').addEventListener('click', async () => {
        if (config.isFlash) {
            const flash = document.getElementById('shutterFlash');
            flash.classList.add('animate');
            setTimeout(() => flash.classList.remove('animate'), 300);
        }

        const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
        let videoBlobUrl = null;

        if (config.isLive && liveChunks.length > 0) {
            const liveBlob = new Blob(liveChunks, { type: 'video/mp4' });
            videoBlobUrl = URL.createObjectURL(liveBlob);
        }

        const mediaItem = {
            imageUrl: dataUrl,
            videoUrl: videoBlobUrl,
            isLive: config.isLive && !!videoBlobUrl
        };

        await saveMediaToDB(mediaItem);
    });

    // --- UI Controls Event Listeners ---
    const ratioToggleBtn = document.getElementById('ratioToggle');
    const ratioDrawer = document.getElementById('ratioDrawer');

    ratioToggleBtn.addEventListener('click', () => {
        ratioDrawer.classList.toggle('show');
    });

    document.querySelectorAll('.ratio-option').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.ratio-option').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            config.ratio = e.target.getAttribute('data-ratio');
            ratioToggleBtn.innerText = config.ratio;
            ratioDrawer.classList.remove('show');
        });
    });

    // GPU Lens Transformer for 0.5x
    document.querySelectorAll('.zoom-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            config.zoom = parseFloat(e.target.getAttribute('data-zoom'));

            if (config.zoom === 0.5) {
                canvas.classList.add('ultrawide');
            } else {
                canvas.classList.remove('ultrawide');
            }
        });
    });

    // Camera Switcher
    document.getElementById('switchCamera').addEventListener('click', () => {
        config.facingMode = (config.facingMode === 'user') ? 'environment' : 'user';
        startCamera();
    });

    // Live Mode Toggle
    const liveToggleBtn = document.getElementById('liveToggle');
    const liveTag = document.getElementById('liveTag');
    liveToggleBtn.addEventListener('click', () => {
        config.isLive = !config.isLive;
        liveToggleBtn.classList.toggle('active', config.isLive);
        liveTag.classList.toggle('show', config.isLive);
    });

    // Flash Toggle
    const flashToggleBtn = document.getElementById('flashToggle');
    flashToggleBtn.addEventListener('click', () => {
        config.isFlash = !config.isFlash;
        flashToggleBtn.classList.toggle('active', config.isFlash);
        updateTorchState();
    });

    // Stabilizer Toggle
    const stabToggleBtn = document.getElementById('stabToggle');
    stabToggleBtn.addEventListener('click', () => {
        config.isStab = !config.isStab;
        stabToggleBtn.classList.toggle('active', config.isStab);
    });

    // --- Gallery Preview & Touch Interactivity ---
    const galleryContainer = document.getElementById('galleryContainer');
    const galleryImg = document.getElementById('galleryImg');
    const galleryVideo = document.getElementById('galleryVideo');
    const liveHint = document.getElementById('liveHint');

    document.getElementById('galleryPreview').addEventListener('click', () => {
        if (!currentMediaList.length) return;
        activeMediaIndex = 0;
        const current = currentMediaList[activeMediaIndex];

        galleryImg.src = current.imageUrl;
        galleryImg.style.display = 'block';
        galleryVideo.style.display = 'none';

        if (current.isLive && current.videoUrl) {
            galleryVideo.src = current.videoUrl;
            liveHint.style.display = 'block';
        } else {
            liveHint.style.display = 'none';
        }

        document.getElementById('galleryModal').classList.add('show');
    });

    // Press and Hold to Play Live Photo Clip
    function startLivePlayback() {
        const current = currentMediaList[activeMediaIndex];
        if (current && current.isLive && current.videoUrl) {
            galleryImg.style.display = 'none';
            galleryVideo.style.display = 'block';
            galleryVideo.play();
        }
    }

    function stopLivePlayback() {
        galleryVideo.pause();
        galleryVideo.style.display = 'none';
        galleryImg.style.display = 'block';
    }

    galleryContainer.addEventListener('touchstart', startLivePlayback);
    galleryContainer.addEventListener('touchend', stopLivePlayback);
    galleryContainer.addEventListener('mousedown', startLivePlayback);
    galleryContainer.addEventListener('mouseup', stopLivePlayback);

    // Save/Download Media to Local Device Gallery
    document.getElementById('downloadBtn').addEventListener('click', () => {
        if (!currentMediaList.length) return;
        const current = currentMediaList[activeMediaIndex];
        const a = document.createElement('a');
        a.href = current.imageUrl;
        a.download = `photo_${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });

    // Delete Media Item
    document.getElementById('deleteBtn').addEventListener('click', () => {
        deleteCurrentMedia();
    });

    document.getElementById('closeGallery').addEventListener('click', () => {
        document.getElementById('galleryModal').classList.remove('show');
    });

    // --- App Initialization ---
    initDatabase();
    startCamera();
    requestAnimationFrame(renderViewfinder);
    requestAnimationFrame(applyStabilizer);
</script>
</body>
</html>
